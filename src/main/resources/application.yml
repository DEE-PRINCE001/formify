
spring:
  config:
    import: optional:classpath:application_sec.yml
  application:
    name:
      formify
  datasource:
    url: ${DATABASE_URL}jdbc:postgresql://localhost:5432/formify
    username: ${DATABASE_USER}postgres
    password: ${DATABASE_PASSWORD} 0.7.0.3.2.7.4.6.6.4.2.
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql:true

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - email
              - profile
          github:
            client-id: ${GITHUB_CLIENT_ID}
            client-secret: ${GITHUB_CLIENT_SECRET}
            scope:
              - user:email
              - read:user
app:
  oauth2:
    redirectUri: http://localhost:3000/oauth2/redirect










